name: Update Phrase of the Day

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick quote & Update README
        run: |
          python3 -c '
          import random

          with open("quotes.txt", "r", encoding="utf-8") as f:
              quotes = [line.strip() for line in f if line.strip()]

          if quotes:
              selected = random.choice(quotes)
              with open("README.md", "r", encoding="utf-8") as f:
                  content = f.read()

              start = "<!-- QUOTE:START -->"
              end = "<!-- QUOTE:END -->"

              if start in content and end in content:
                  before = content.split(start)[0]
                  after = content.split(end)[1]
                  new_block = f"{start}\n> *\"{selected}\"*\n{end}"
                  with open("README.md", "w", encoding="utf-8") as f:
                      f.write(before + new_block + after)
          '

      - name: Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update phrase of the day" && git push)